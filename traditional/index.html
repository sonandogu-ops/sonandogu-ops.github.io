<style>:root{
  --bg:#F4F4F1; --surface:#FFFFFF; --ink:#141518; --muted:#6B6D73; --faint:#A3A5AA;
  --line:rgba(20,21,24,.08); --field:#F4F4F1; --orange:#FF5A1F; --orange2:#FF8A3D;
  --shadow:0 1px 2px rgba(20,21,24,.04), 0 18px 40px -18px rgba(20,21,24,.22);
  --head:rgba(244,244,241,.78); color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0E0F11; --surface:#17181B; --ink:#F2F2EF; --muted:#8E9097; --faint:#5E6066;
    --line:rgba(255,255,255,.08); --field:#1F2024;
    --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 24px 48px -20px rgba(0,0,0,.6);
    --head:rgba(14,15,17,.72); color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Pretendard Variable","Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  line-height:1.6; -webkit-font-smoothing:antialiased; letter-spacing:-.01em;
}
.top{position:sticky; top:0; z-index:10; background:var(--head); backdrop-filter:saturate(1.6) blur(14px); -webkit-backdrop-filter:saturate(1.6) blur(14px); border-bottom:1px solid var(--line)}
.top .in{max-width:1040px; margin:0 auto; padding:12px 20px; display:flex; align-items:center; justify-content:space-between}
.brand{display:inline-flex; align-items:center; gap:9px; text-decoration:none; color:var(--ink); font-weight:800; font-size:16px; letter-spacing:-.03em}
.brand svg{display:block}
.top nav a{color:var(--muted); text-decoration:none; font-size:14px; font-weight:600}
.top nav a:hover{color:var(--ink)}
a:focus-visible,button:focus-visible{outline:2px solid var(--orange); outline-offset:3px; border-radius:8px}
.container{max-width:1040px; margin:0 auto; padding:0 20px}
footer{max-width:1040px; margin:72px auto 0; padding:28px 20px 48px; border-top:1px solid var(--line); display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; font-size:13px; color:var(--muted)}
footer b{color:var(--ink); font-weight:800; letter-spacing:-.03em}

.hero{padding:64px 0 36px}
.hero h1{font-size:clamp(40px,9vw,72px); font-weight:800; letter-spacing:-.055em; line-height:1.04; margin:0 0 18px}
.hero h1 span{color:var(--faint)}
.hero p{font-size:18px; color:var(--muted); margin:0; max-width:28em}
.grid{display:grid; gap:12px; grid-template-columns:1fr}
@media (min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:960px){.grid{grid-template-columns:repeat(3,1fr)}}
.t{position:relative; overflow:hidden; display:flex; flex-direction:column; justify-content:space-between; min-height:200px; text-decoration:none; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:28px; padding:22px; box-shadow:var(--shadow); transition:transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s}
.t:hover{transform:translateY(-4px)}
.ic{width:56px; height:56px; border-radius:18px; display:grid; place-items:center; font-weight:800; font-size:28px; color:#fff; background:linear-gradient(145deg,#FF8A3D,#FF4A12); box-shadow:0 10px 24px -10px rgba(255,90,31,.8), inset 0 1px 0 rgba(255,255,255,.35)}
.t strong{display:block; font-size:21px; font-weight:800; letter-spacing:-.035em; margin-top:28px}
.t .d{display:block; font-size:14px; color:var(--muted); margin-top:2px}
.t .go{position:absolute; top:22px; right:22px; width:34px; height:34px; border-radius:50%; border:1px solid var(--line); display:grid; place-items:center; color:var(--muted); transition:all .3s}
.t:hover .go{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.soon{min-height:200px; border-radius:28px; border:1px solid var(--line); padding:22px; display:flex; flex-direction:column; justify-content:space-between; color:var(--muted)}
.soon .ic{background:var(--field); color:var(--faint); box-shadow:none}
.soon strong{display:block; font-size:19px; font-weight:800; letter-spacing:-.03em; color:var(--muted)}
.soon .tag{display:inline-block; font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px; background:var(--field); margin-top:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.crumb{font-size:14px; font-weight:600; color:var(--muted); margin-bottom:12px}
.crumb a{color:var(--muted); text-decoration:none}
footer .fl{display:flex; gap:16px}
footer .fl a{color:var(--muted); text-decoration:none; font-weight:600}
footer .fl a:hover{color:var(--ink)}
</style>
</head>
