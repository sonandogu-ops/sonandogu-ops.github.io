<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>손안의도구 - 자주 쓰는 계산기와 생활 도구 모음</title>
<meta name="description" content="퍼센트 계산기를 비롯해 일상에서 자주 쓰는 계산기와 도구를 설치 없이 바로 쓸 수 있는 손안의도구.">
<meta property="og:site_name" content="손안의도구">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#F7F8FB;--surface:#FFFFFF;--ink:#1B2350;--muted:#5B6386;--line:#DDE1EE;--mark:#FFE15A;--focus:#3D5AFE;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#12152A;--surface:#1A1E38;--ink:#E9ECFA;--muted:#A0A7C8;--line:#2C3256;--mark:#8A7414;--focus:#8C9EFF;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:48px 20px 64px}
h1{font-size:clamp(40px,10vw,56px);font-weight:800;letter-spacing:-.04em;line-height:1.05;margin:0 0 10px}
.lede{color:var(--muted);margin:0 0 36px}
.tool{display:block;text-decoration:none;color:inherit;background:var(--surface);border-top:3px solid var(--ink);padding:20px;margin-bottom:14px}
.tool:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.tool strong{font-size:20px;background:linear-gradient(transparent 60%,var(--mark) 60%)}
.tool p{margin:6px 0 0;color:var(--muted);font-size:15px}
.soon{color:var(--muted);font-size:14px;margin-top:24px}
footer{margin-top:56px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <h1>손안의도구</h1>
  <p class="lede">설치도 가입도 없이, 필요할 때 바로 꺼내 쓰는 계산기와 생활 도구.</p>
  <main>
    <a class="tool" href="/percent/">
      <strong>퍼센트 계산기</strong>
      <p>몇 %인지, 몇 % 올랐는지, 할인가와 원래 가격까지 한 번에</p>
    </a>
  </main>
  <p class="soon">새 도구가 계속 추가됩니다.</p>
  <footer>손안의도구 · 입력한 내용은 어디에도 저장되지 않습니다.</footer>
</div>
</body>
</html>
